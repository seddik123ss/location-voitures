<div class="layout">
  <aside class="sidebar">
    <div class="brand">Location <span>Voitures</span></div>
    <nav>
      @for (item of menu; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active">{{ item.label }}</a>
      }
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <span class="user">{{ username }} <small>{{ role }}</small></span>
      <button type="button" (click)="logout()">Se déconnecter</button>
    </header>
    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
