[pytest]
# Lancement : pytest (depuis services/ml-service, venv activé)
testpaths = tests
# Le dossier du service est ajouté au chemin Python : "import app", "import main", "import scripts"
pythonpath = .
addopts = -ra
filterwarnings =
    # Avertissement interne à Starlette/FastAPI (leur client de test passera à httpx2) : pas notre code
    ignore:Using `httpx` with `starlette.testclient` is deprecated
