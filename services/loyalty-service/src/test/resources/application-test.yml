# Profil de test : base H2 en mémoire (mode MySQL), mêmes migrations Flyway, sans Eureka, Keycloak ni RabbitMQ.
spring:
  cloud:
    config:
      enabled: false   # pas de Config Server pendant les tests
  datasource:
    url: jdbc:h2:mem:loyalty_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  rabbitmq:
    listener:
      simple:
        auto-startup: false   # les tests appellent EventProcessor directement
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-secret: test-secret

eureka:
  client:
    enabled: false
