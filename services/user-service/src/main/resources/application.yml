# Les valeurs viennent du fichier .env du service (non commité, voir .env.example).
# Les valeurs après ":" sont les valeurs par défaut si la variable est absente.
spring:
  config:
    # 1) .env du service (secrets) ; 2) Config Server (infra/config-repo : rental-user.yml + application.yml).
    # "optional:" : Config Server arrêté -> avertissement et démarrage avec les valeurs par défaut ci-dessous.
    import: optional:file:.env[.properties], optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  application:
    name: RENTAL-USER
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_db}
    username: ${DB_USERNAME:user_svc}
    password: ${DB_PASSWORD:user_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # le schéma est géré par Flyway, Hibernate vérifie seulement
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_uuid_jdbc_type: CHAR        # UUID stockés en CHAR(36)
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      # Validation des tokens reçus (Keycloak, rôles dans la claim "roles").
      # L'émetteur reste localhost:8180 ; dans Docker, les clés et le token se récupèrent par keycloak:8080
      # (KEYCLOAK_JWKS, KEYCLOAK_TOKEN_URL). Sans ces variables (mvnw spring-boot:run), on part de KEYCLOAK_ISSUER.
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:${keycloak.issuer:http://localhost:8180/realms/location-voitures}}
          jwk-set-uri: ${KEYCLOAK_JWKS:${KEYCLOAK_ISSUER:${keycloak.issuer:http://localhost:8180/realms/location-voitures}}/protocol/openid-connect/certs}
      # Token du compte de service user-service (rôle INTERNAL) pour appeler les autres services
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:user-service}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URL:${KEYCLOAK_ISSUER:${keycloak.issuer:http://localhost:8180/realms/location-voitures}}/protocol/openid-connect/token}
  cloud:
    config:
      name: rental-user               # fichier lu dans infra/config-repo (Config Server)
      request-connect-timeout: 3000
      request-read-timeout: 3000
    openfeign:
      client:
        config:
          RENTAL-RESERVATION:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

server:
  port: ${SERVICE_PORT:${service.port:8101}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:${eureka.url:http://localhost:8761/eureka}}
  instance:
    hostname: ${SERVICE_HOST:${service.host:host.docker.internal}}   # docs/conventions.md : jamais d'IP détectée
    prefer-ip-address: false
    status-page-url-path: /swagger-ui.html   # lien du tableau de bord Eureka : Swagger UI

app:
  reservations:
    # true = réponses simulées (tant que reservation-service n'est pas prêt) ; false = vrai appel OpenFeign
    mock: ${RESERVATIONS_MOCK:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.location.userservice.reservation.ReservationClient: DEBUG
