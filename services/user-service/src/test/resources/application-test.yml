# Profil de test : base H2 en mémoire (mode MySQL), mêmes migrations Flyway, sans Eureka ni Keycloak.
spring:
  cloud:
    config:
      enabled: false   # pas de Config Server pendant les tests
  datasource:
    url: jdbc:h2:mem:user_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-secret: test-secret

eureka:
  client:
    enabled: false

app:
  reservations:
    mock: true
