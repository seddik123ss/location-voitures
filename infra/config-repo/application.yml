# Configuration COMMUNE a tous les services, servie par le Config Server (infra/config-server).
# AUCUN secret ici : mots de passe, secrets Keycloak et URL avec identifiants restent dans le .env de chaque service.
service:
  host: host.docker.internal          # nom annonce dans Eureka (docs/conventions.md)
eureka:
  url: http://localhost:8761/eureka
keycloak:
  issuer: http://localhost:8180/realms/location-voitures
rabbitmq:
  host: localhost
  port: 5672
  management-url: http://localhost:15672
