name: location-voitures

# Variables communes aux conteneurs de complaint-service (profil "services").
x-complaint-env: &complaint-env
  DATABASE_URL: mysql://complaint_svc:complaint_pwd@mysql:3306/complaint_db?serverVersion=8.4&charset=utf8mb4
  EUREKA_URL: http://eureka:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
  SERVICE_HOST: host.docker.internal
  SERVICE_PORT: "8106"
  # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
  KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
  KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
  KEYCLOAK_CLIENT_ID: complaint-service
  KEYCLOAK_CLIENT_SECRET: ${COMPLAINT_KEYCLOAK_CLIENT_SECRET:-}
  APP_SECRET: ${COMPLAINT_APP_SECRET:-}
  LOOKUP_MODE: ${COMPLAINT_LOOKUP_MODE:-demo}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672

# Variables communes aux conteneurs de reservation-service (profil "services").
x-reservation-env: &reservation-env
  DB_CONNECTION: mysql
  DB_URL: mysql://reservation_svc:reservation_pwd@mysql:3306/reservation_db
  EUREKA_URL: http://eureka:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
  SERVICE_HOST: host.docker.internal
  SERVICE_PORT: "8103"
  # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
  KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
  KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
  KEYCLOAK_CLIENT_ID: reservation-service
  KEYCLOAK_CLIENT_SECRET: ${RESERVATION_KEYCLOAK_CLIENT_SECRET:-}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  LOOKUP_MODE: ${RESERVATION_LOOKUP_MODE:-demo}

# Variables communes aux conteneurs de payment-service (profil "services").
x-payment-env: &payment-env
  SERVICE_PORT: "8104"
  SERVICE_HOST: host.docker.internal
  DB_URL: postgres://payment_svc:payment_pwd@postgres:5432/payment_db
  EUREKA_URL: http://eureka:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
  # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
  KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
  KEYCLOAK_CLIENT_ID: payment-service
  KEYCLOAK_CLIENT_SECRET: ${PAYMENT_KEYCLOAK_CLIENT_SECRET:-}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
  DJANGO_SECRET_KEY: ${PAYMENT_DJANGO_SECRET_KEY:-change-me-dev-only}
  DJANGO_DEBUG: "false"
  AUTH_MODE: jwt
  EVENT_PUBLISHER: ${PAYMENT_EVENT_PUBLISHER:-log}
  RESERVATION_CLIENT: ${PAYMENT_RESERVATION_CLIENT:-fake}

# Variables communes aux conteneurs de vehicle-service (profil "services").
x-vehicle-env: &vehicle-env
  SERVICE_PORT: "8102"
  SERVICE_HOST: host.docker.internal
  DB_URL: mysql://vehicle_svc:vehicle_pwd@mysql:3306/vehicle_db
  SHADOW_DB_URL: mysql://vehicle_svc:vehicle_pwd@mysql:3306/vehicle_shadow
  EUREKA_URL: http://eureka:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
  # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
  KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
  KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
  KEYCLOAK_CLIENT_ID: vehicle-service
  KEYCLOAK_CLIENT_SECRET: ${VEHICLE_KEYCLOAK_CLIENT_SECRET:-}
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  RESERVATION_MOCK: ${VEHICLE_RESERVATION_MOCK:-true}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports: ["3306:3306"]
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg-data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
    ports: ["8180:8080"]
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - keycloak-data:/opt/keycloak/data
  eureka:
    build: ./eureka-server
    ports: ["8761:8761"]
  gateway:
    build: ./api-gateway
    ports: ["8088:8088"]
    environment:
      EUREKA_URL: http://eureka:8761/eureka
      KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
      KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
    depends_on: [eureka, keycloak]
  # Config Server : configuration non secrète des services (infra/config-repo), ex. GET http://localhost:8888/rental-ml/default
  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    environment:
      EUREKA_URL: http://eureka:8761/eureka
    volumes:
      - ./config-repo:/config-repo:ro
    depends_on: [eureka]

  # Services métier : profil "services", donc absents de "docker compose up -d" (infrastructure seule).
  # docker compose --profile services up -d --build complaint-service complaint-eureka
  complaint-service:
    profiles: [services]
    build:
      context: ../services/complaint-service
      additional_contexts:
        shared: ../shared
    image: location-voitures/complaint-service
    ports: ["8106:8106"]
    environment: *complaint-env
    depends_on: [mysql, eureka, keycloak]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8106/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
  complaint-eureka:
    profiles: [services]
    build:
      context: ../services/complaint-service
      additional_contexts:
        shared: ../shared
    image: location-voitures/complaint-service
    command: ["php", "bin/console", "app:eureka:run"]
    environment: *complaint-env
    depends_on:
      complaint-service:
        condition: service_healthy
    stop_grace_period: 15s

  # docker compose --profile services up -d --build user-service
  user-service:
    profiles: [services]
    build: ../services/user-service
    image: location-voitures/user-service
    ports: ["8101:8101"]
    environment:
      SERVICE_PORT: "8101"
      SERVICE_HOST: host.docker.internal
      DB_URL: jdbc:mysql://mysql:3306/user_db
      DB_USERNAME: user_svc
      DB_PASSWORD: user_pwd
      EUREKA_URL: http://eureka:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
      # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
      KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: user-service
      KEYCLOAK_CLIENT_SECRET: ${USER_KEYCLOAK_CLIENT_SECRET:-}
      RESERVATIONS_MOCK: ${USER_RESERVATIONS_MOCK:-true}
    depends_on: [mysql, eureka, keycloak]
    # MySQL peut être encore en démarrage au premier lancement : on relance le service s'il échoue.
    restart: on-failure
    stop_grace_period: 15s

  # docker compose --profile services up -d --build loyalty-service
  # API + consommateur RabbitMQ (loyalty.user_events, loyalty.reservation_completed) dans le même processus.
  loyalty-service:
    profiles: [services]
    build: ../services/loyalty-service
    image: location-voitures/loyalty-service
    ports: ["8108:8108"]
    environment:
      SERVICE_PORT: "8108"
      SERVICE_HOST: host.docker.internal
      DB_URL: jdbc:mysql://mysql:3306/loyalty_db
      DB_USERNAME: loyalty_svc
      DB_PASSWORD: loyalty_pwd
      EUREKA_URL: http://eureka:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
      # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
      KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: loyalty-service
      KEYCLOAK_CLIENT_SECRET: ${LOYALTY_KEYCLOAK_CLIENT_SECRET:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on: [mysql, eureka, keycloak, rabbitmq]
    # MySQL peut être encore en démarrage au premier lancement : on relance le service s'il échoue.
    restart: on-failure
    stop_grace_period: 15s

  # docker compose --profile services up -d --build reservation-service reservation-eureka reservation-consumer
  # Une image, trois conteneurs : API (migrations + données de démo si la base est vide), Eureka, consommateur RabbitMQ.
  reservation-service:
    profiles: [services]
    build:
      context: ../services/reservation-service
      additional_contexts:
        shared: ../shared
    image: location-voitures/reservation-service
    ports: ["8103:8103"]
    environment: *reservation-env
    depends_on: [mysql, eureka, keycloak, rabbitmq]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8103/health') === false ? 1 : 0);"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
  reservation-eureka:
    profiles: [services]
    image: location-voitures/reservation-service
    command: ["php", "artisan", "eureka:run"]
    environment: *reservation-env
    depends_on:
      reservation-service:
        condition: service_healthy
    stop_grace_period: 15s
  reservation-consumer:
    profiles: [services]
    image: location-voitures/reservation-service
    command: ["php", "artisan", "rabbitmq:consume"]
    environment: *reservation-env
    depends_on:
      reservation-service:
        condition: service_healthy
    stop_grace_period: 15s

  # docker compose --profile services up -d --build payment-service payment-consumer
  # Une image, deux conteneurs : API (migrations puis gunicorn, inscription RENTAL-PAYMENT), consommateur RabbitMQ.
  payment-service:
    profiles: [services]
    build: ../services/payment-service
    image: location-voitures/payment-service
    ports: ["8104:8104"]
    environment: *payment-env
    depends_on: [postgres, eureka, keycloak, rabbitmq]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
  payment-consumer:
    profiles: [services]
    image: location-voitures/payment-service
    command: ["python", "manage.py", "consume_events"]
    environment: *payment-env
    depends_on:
      payment-service:
        condition: service_healthy
    # RabbitMQ peut être encore en démarrage au premier lancement : on relance le consommateur s'il échoue.
    restart: on-failure
    stop_grace_period: 15s

  # docker compose --profile services up -d --build vehicle-service vehicle-consumer
  # Une image, deux conteneurs : API Next.js (migrations Prisma, inscription RENTAL-VEHICLE), consommateur RabbitMQ.
  vehicle-service:
    profiles: [services]
    build:
      context: ../services/vehicle-service
      additional_contexts:
        docs: ../docs   # contrat docs/openapi/vehicle-service.yaml servi par /openapi.yaml
    image: location-voitures/vehicle-service
    ports: ["8102:8102"]
    environment: *vehicle-env
    depends_on: [mysql, eureka, keycloak, rabbitmq]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8102/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    stop_grace_period: 15s
  vehicle-consumer:
    profiles: [services]
    image: location-voitures/vehicle-service
    command: ["./node_modules/.bin/tsx", "consumer/index.ts"]
    environment: *vehicle-env
    depends_on:
      vehicle-service:
        condition: service_healthy
    restart: on-failure
    stop_grace_period: 15s

  # docker compose --profile services up -d --build contract-service
  # API + inscription RENTAL-CONTRACT (Steeltoe) + consommateur RabbitMQ dans le même processus ; migrations au démarrage.
  contract-service:
    profiles: [services]
    build: ../services/contract-service
    image: location-voitures/contract-service
    ports: ["8105:8105"]
    environment:
      SERVICE_PORT: "8105"
      SERVICE_HOST: host.docker.internal
      DB_URL: Host=postgres;Port=5432;Database=contract_db;Username=contract_svc;Password=contract_pwd
      EUREKA_URL: http://eureka:8761/eureka
      CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
      # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
      KEYCLOAK_JWKS: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: contract-service
      KEYCLOAK_CLIENT_SECRET: ${CONTRACT_KEYCLOAK_CLIENT_SECRET:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      USE_FAKE_SERVICES: ${CONTRACT_USE_FAKE_SERVICES:-true}
    depends_on: [postgres, eureka, keycloak, rabbitmq]
    # PostgreSQL peut être encore en démarrage au premier lancement : on relance le service s'il échoue.
    restart: on-failure
    stop_grace_period: 15s

  # docker compose --profile services up -d --build ml-service
  # API + inscription RENTAL-ML + consommateur RabbitMQ (ml.reservation_completed) ; alembic upgrade head au démarrage.
  ml-service:
    profiles: [services]
    build: ../services/ml-service
    image: location-voitures/ml-service
    ports: ["8107:8107"]
    environment:
      SERVICE_PORT: "8107"
      SERVICE_HOST: host.docker.internal
      DB_URL: postgresql+psycopg://ml_svc:ml_pwd@postgres:5432/ml_db
      EUREKA_URL: http://eureka:8761/eureka
      EUREKA_ENABLED: "true"
      CONFIG_SERVER_URL: http://config-server:8888   # configuration non secrète (infra/config-repo)
      # L'émetteur des tokens reste localhost:8180 (KC_HOSTNAME) ; le conteneur joint Keycloak par keycloak:8080.
      KEYCLOAK_ISSUER: http://localhost:8180/realms/location-voitures
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/location-voitures/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: ml-service
      KEYCLOAK_CLIENT_SECRET: ${ML_KEYCLOAK_CLIENT_SECRET:-}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_ENABLED: "true"
    volumes:
      # Modèles entraînés partagés avec le lancement local (la base ml_db référence ces fichiers)
      - ../services/ml-service/artifacts:/app/artifacts
    depends_on: [postgres, eureka, keycloak, rabbitmq]
    stop_grace_period: 15s
volumes:
  mysql-data: {}
  pg-data: {}
  keycloak-data: {}
