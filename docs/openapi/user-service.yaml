  responses:
    BadRequest:
      description: "Requête invalide (JSON illisible, paramètre ou champ obligatoire\
        \ manquant)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 400
            error: BAD_REQUEST
            message: Champs obligatoires manquants
            details:
            - message: ne doit pas être vide
              field: firstname
    Unauthorized:
      description: Token absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 401
            error: UNAUTHORIZED
            message: "Authentification requise : token Bearer absent ou invalide"
            details: []
    Forbidden:
      description: Rôle insuffisant ou ressource d'un autre utilisateur
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 403
            error: FORBIDDEN
            message: "Accès refusé : rôle insuffisant ou ressource d'un autre utilisateur"
            details: []
    NotFound:
      description: Objet introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 404
            error: NOT_FOUND
            message: "Utilisateur introuvable : f4d1bab3-468d-428d-b02c-b44341430bfd"
            details: []
    Conflict:
      description: Conflit métier (doublon)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 409
            error: CONFLICT
            message: Cet email est déjà utilisé
            details:
            - message: Cet email est déjà utilisé
              field: email
    Unprocessable:
      description: Règle métier ou format non respecté
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 422
            error: UNPROCESSABLE_ENTITY
            message: Données invalides
            details:
            - message: Format d'email invalide
              field: email
    BadGateway:
      description: Réponse illisible de reservation-service
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 502
            error: BAD_GATEWAY
            message: Réponse illisible de reservation-service
            details: []
    ServiceUnavailable:
      description: reservation-service arrêté ou absent d'Eureka
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 503
            error: SERVICE_UNAVAILABLE
            message: reservation-service est indisponible (arrêté ou absent d'Eureka)
            details: []
  securitySchemes:
    bearerAuth:
      type: http
      description: Token Keycloak (realm location-voitures). Voir le README pour l'obtenir.
      scheme: bearer
      bearerFormat: JWT
