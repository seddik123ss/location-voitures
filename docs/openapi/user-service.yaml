    UpdateLicenseRequest:
      required:
      - category
      - expiryDate
      - issueDate
      - number
      type: object
      properties:
        number:
          maxLength: 30
          minLength: 0
          type: string
          example: TN-2020-000111
        category:
          pattern: ^(A|A1|B|BE|C|CE|D|D1|DE|H)$
          type: string
          example: B
        issueDate:
          type: string
          format: date
          example: 2020-03-15
        expiryDate:
          type: string
          format: date
          example: 2030-03-15
