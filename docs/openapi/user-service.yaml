        la vérification.
    CreateUserRequest:
      required:
      - email
      - firstname
      - id
      - lastname
      - role
      type: object
      properties:
        id:
          type: string
          description: Identifiant Keycloak (claim "sub") de l'utilisateur
          format: uuid
          example: 2b6c1f0e-7a1d-4f7e-9a51-3c1d2e4f5a6b
        firstname:
          maxLength: 100
          minLength: 0
          type: string
          example: Sami
        lastname:
          maxLength: 100
          minLength: 0
          type: string
          example: Ben Ali
        email:
          maxLength: 255
          minLength: 0
          type: string
          example: sami.benali@test.tn
        phone:
          pattern: "^\\+?[0-9]{8,15}$"
          type: string
          description: "Facultatif. 8 à 15 chiffres, \"+\" initial autorisé"
          example: "+21698765432"
        role:
          type: string
          description: "Un utilisateur non ADMIN ne peut créer que son propre profil,\
            \ avec le rôle CLIENT"
          example: CLIENT
          enum:
          - CLIENT
          - AGENT
          - ADMIN
        active:
          type: boolean
          description: "Facultatif, true par défaut"
          example: true
      description: Création d'un profil utilisateur
    CreateLicenseRequest:
      required:
      - category
      - expiryDate
      - issueDate
      - number
      - userId
      type: object
      properties:
