openapi: 3.0.1
info:
  title: user-service
  description: |-
    Utilisateurs, adresses et permis de conduire de la plateforme de location de voitures.
    L'identifiant d'un utilisateur est son identifiant Keycloak ("sub").
    Rôles : ADMIN gère les utilisateurs ; AGENT consulte et vérifie les permis ;
    CLIENT lit et modifie son propre profil ; INTERNAL (comptes de service) pour /internal/**.
  version: 1.0.0
servers:
- url: http://localhost:8101
  description: "direct (développement, Swagger UI)"
- url: http://localhost:8088
  description: via la Gateway
security:
- bearerAuth: []
tags:
- name: Adresses
  description: Adresses d'un utilisateur
- name: Interne
  description: "Routes pour les autres microservices (token de compte de service,\
    \ rôle INTERNAL)"
- name: Permis
  description: Permis de conduire (un par utilisateur)
- name: Santé
  description: État du service
- name: Utilisateurs
  description: Profils des utilisateurs (id = identifiant Keycloak)
paths:
  /api/users/{userId}/addresses/{addressId}:
    get:
      tags:
      - Adresses
      summary: Consulter une adresse
      description: "Rôles : ADMIN, AGENT, ou l'utilisateur lui-même."
      operationId: get_1
      parameters:
      - name: userId
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      - name: addressId
        in: path
        description: Identifiant de l'adresse
        required: true
        schema:
          type: string
          format: uuid
        example: fa1bace4-042a-4ce2-be5f-d4c3cb4b98da
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Adresse
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags:
      - Adresses
      summary: Modifier une adresse
      description: "ADMIN, ou l'utilisateur lui-même."
      operationId: update
      parameters:
      - name: userId
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      - name: addressId
        in: path
        description: Identifiant de l'adresse
        required: true
        schema:
          type: string
          format: uuid
        example: fa1bace4-042a-4ce2-be5f-d4c3cb4b98da
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "200":
          description: Adresse modifiée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - Adresses
      summary: Supprimer une adresse
      description: "ADMIN, ou l'utilisateur lui-même."
      operationId: delete
      parameters:
      - name: userId
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      - name: addressId
        in: path
        description: Identifiant de l'adresse
        required: true
        schema:
          type: string
          format: uuid
        example: fa1bace4-042a-4ce2-be5f-d4c3cb4b98da
      responses:
        "204":
          description: Supprimée
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/{id}:
    get:
      tags:
      - Utilisateurs
      summary: Consulter un utilisateur
      description: "Rôles : ADMIN, AGENT, ou l'utilisateur lui-même. Renvoie le profil\
        \ avec adresses et permis."
      operationId: get_2
      parameters:
      - name: id
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Profil complet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags:
      - Utilisateurs
      summary: Modifier un utilisateur
      description: "ADMIN, ou l'utilisateur lui-même. Seul un ADMIN peut changer `role`\
        \ et `active` (sinon 403)."
      operationId: update_1
      parameters:
      - name: id
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Profil modifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - Utilisateurs
      summary: Supprimer un utilisateur
      description: "Rôle : ADMIN. Supprime aussi ses adresses et son permis."
      operationId: delete_1
      parameters:
      - name: id
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/licenses/{id}:
    get:
      tags:
      - Permis
      summary: Consulter un permis
      description: "Rôles : ADMIN, AGENT, ou le propriétaire du permis."
      operationId: get_3
      parameters:
      - name: id
        in: path
        description: Identifiant du permis
        required: true
        schema:
          type: string
          format: uuid
        example: edc2e0e3-709d-4caa-b617-53e4c5f128cf
      responses:
        "200":
          description: Permis
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LicenseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    put:
      tags:
      - Permis
      summary: Modifier un permis
      description: "ADMIN, ou le propriétaire. Une modification annule la vérification\
        \ (verified = false)."
      operationId: update_2
      parameters:
      - name: id
        in: path
        description: Identifiant du permis
        required: true
        schema:
          type: string
          format: uuid
        example: edc2e0e3-709d-4caa-b617-53e4c5f128cf
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLicenseRequest"
        required: true
      responses:
        "200":
          description: Permis modifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LicenseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags:
      - Permis
      summary: Supprimer un permis
      description: "ADMIN, ou le propriétaire."
      operationId: delete_2
      parameters:
      - name: id
        in: path
        description: Identifiant du permis
        required: true
        schema:
          type: string
          format: uuid
        example: edc2e0e3-709d-4caa-b617-53e4c5f128cf
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Supprimé
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users:
    get:
      tags:
      - Utilisateurs
      summary: Lister les utilisateurs (filtre et pagination)
      description: "Rôles : ADMIN, AGENT. Tri par nom puis prénom. Le filtre `name`\
        \ cherche dans le prénom, le nom ou \"prénom nom\", sans tenir compte de la\
        \ casse."
      operationId: list
      parameters:
      - name: role
        in: query
        description: Filtrer par rôle
        required: false
        schema:
          type: string
          enum:
          - CLIENT
          - AGENT
          - ADMIN
        example: CLIENT
      - name: name
        in: query
        description: Texte cherché dans le prénom ou le nom
        required: false
        schema:
          type: string
        example: client
      - name: page
        in: query
        description: Numéro de page (à partir de 0)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Taille de page (1 à 100)
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: "Page d'utilisateurs {items, page, size, total}"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseUserSummaryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
      - Utilisateurs
      summary: Créer un profil utilisateur
      description: "ADMIN : n'importe quel profil. Autre utilisateur connecté : uniquement\
        \ son propre profil (id = son \"sub\"), actif, avec le rôle CLIENT. Réponse\
        \ 201 avec l'en-tête Location."
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          description: "Profil créé (en-tête Location : /api/users/{id})"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/{userId}/addresses:
    get:
      tags:
      - Adresses
      summary: Lister les adresses d'un utilisateur
      description: "Rôles : ADMIN, AGENT, ou l'utilisateur lui-même."
      operationId: list_1
      parameters:
      - name: userId
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Adresses de l'utilisateur
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AddressResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
      - Adresses
      summary: Ajouter une adresse
      description: "ADMIN, ou l'utilisateur lui-même. Réponse 201 avec Location."
      operationId: create_1
      parameters:
      - name: userId
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressRequest"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "201":
          description: Adresse créée
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AddressResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/licenses:
    get:
      tags:
      - Permis
      summary: Lister les permis
      description: "Rôles : ADMIN, AGENT. Filtre facultatif par utilisateur. Tri par\
        \ date d'expiration croissante."
      operationId: list_2
      parameters:
      - name: userId
        in: query
        description: Filtrer par utilisateur
        required: false
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      - name: page
        in: query
        description: Numéro de page (à partir de 0)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Taille de page (1 à 100)
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: "Page de permis {items, page, size, total}"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseLicenseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags:
      - Permis
      summary: Ajouter un permis
      description: "ADMIN, ou l'utilisateur pour lui-même. Règles : un seul permis\
        \ par utilisateur (409), numéro unique (409), permis déjà expiré (422), dé\
        livrance dans le futur ou expiration avant délivrance (422). Le permis cré\
        é n'est pas vérifié. Réponse 201 avec Location."
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLicenseRequest"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "201":
          description: "Permis créé (en-tête Location : /api/licenses/{id})"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LicenseResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/licenses/{id}/verify:
    patch:
      tags:
      - Permis
      summary: Marquer un permis comme vérifié
      description: "Rôles : ADMIN, AGENT (contrôle du permis physique en agence).\
        \ 422 si le permis est expiré."
      operationId: verify
      parameters:
      - name: id
        in: path
        description: Identifiant du permis
        required: true
        schema:
          type: string
          format: uuid
        example: edc2e0e3-709d-4caa-b617-53e4c5f128cf
      responses:
        "200":
          description: Permis vérifié
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LicenseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "400":
          $ref: "#/components/responses/BadRequest"
  /internal/users/{id}:
    get:
      tags:
      - Interne
      summary: Utilisateur + permis (pour reservation-service)
      description: "Format fixé dans docs/internal-api.md : {id, firstname, lastname,\
        \ email, phone, role, active, license: {number, category, issueDate, expiryDate,\
        \ verified} ou null}. Rôle : INTERNAL."
      operationId: get
      parameters:
      - name: id
        in: path
        description: Identifiant Keycloak de l'utilisateur
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "200":
          description: Utilisateur trouvé
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InternalUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "400":
          $ref: "#/components/responses/BadRequest"
  /health:
    get:
      tags:
      - Santé
      summary: Vérifier que le service répond
      description: "Route publique (sans token). Renvoie {\"status\":\"UP\"} (convention\
        \ commune)."
      operationId: health
      responses:
        "200":
          description: Service démarré
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
      security: []
  /api/users/{id}/reservations:
    get:
      tags:
      - Utilisateurs
      summary: Historique des réservations d'un client (OpenFeign)
      description: "Appelle reservation-service (nom Eureka RENTAL-RESERVATION, GET\
        \ /internal/reservations?userId=) avec le token du compte de service. Erreurs\
        \ traduites : introuvable -> 404, service arrêté ou absent d'Eureka -> 503,\
        \ réponse illisible -> 502. Rôles : ADMIN, AGENT, ou le client lui-même. Tant\
        \ que RESERVATIONS_MOCK=true, la réponse est simulée avec les réservations\
        \ de docs/demo-ids.md."
      operationId: reservations
      parameters:
      - name: id
        in: path
        description: Identifiant Keycloak du client
        required: true
        schema:
          type: string
          format: uuid
        example: f4d1bab3-468d-428d-b02c-b44341430bfd
      - name: page
        in: query
        description: Numéro de page (à partir de 0)
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
          default: 0
        example: 0
      - name: size
        in: query
        description: Taille de page (1 à 100)
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 20
        example: 20
      responses:
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: "Page de réservations {items, page, size, total}"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseReservationDto"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/users/me:
    get:
      tags:
      - Utilisateurs
      summary: Mon profil
      description: "Profil de l'utilisateur connecté (id = claim \"sub\" du token),\
        \ avec adresses et permis. 404 si le profil n'a pas encore été créé."
      operationId: me
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Profil complet
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
components:
  schemas:
    AddressRequest:
      required:
      - city
      - street
      - zipCode
      type: object
      properties:
        street:
          maxLength: 255
          minLength: 0
          type: string
          example: 12 Rue de Marseille
        city:
          maxLength: 100
          minLength: 0
          type: string
          example: Tunis
        zipCode:
          pattern: "^[0-9]{4}$"
          type: string
          description: "Code postal tunisien : 4 chiffres"
          example: "1000"
      description: Création ou modification d'une adresse
    AddressResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: fa1bace4-042a-4ce2-be5f-d4c3cb4b98da
        street:
          type: string
          example: 12 Rue de Marseille
        city:
          type: string
          example: Tunis
        zipCode:
          type: string
          example: "1000"
        userId:
          type: string
          format: uuid
          example: f4d1bab3-468d-428d-b02c-b44341430bfd
      description: Adresse
    UpdateUserRequest:
      required:
      - active
      - email
      - firstname
      - lastname
      - role
      type: object
      properties:
        firstname:
          maxLength: 100
          minLength: 0
          type: string
          example: Client
        lastname:
          maxLength: 100
          minLength: 0
          type: string
          example: Un
        email:
          maxLength: 255
          minLength: 0
          type: string
          example: client1@test.tn
        phone:
          pattern: "^\\+?[0-9]{8,15}$"
          type: string
          example: "+21620111111"
        role:
          type: string
          description: Seul un ADMIN peut changer le rôle
          example: CLIENT
          enum:
          - CLIENT
          - AGENT
          - ADMIN
        active:
          type: boolean
          description: Seul un ADMIN peut changer le statut
          example: true
      description: Modification complète d'un profil (PUT)
    LicenseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: edc2e0e3-709d-4caa-b617-53e4c5f128cf
        userId:
          type: string
          format: uuid
          example: f4d1bab3-468d-428d-b02c-b44341430bfd
        number:
          type: string
          example: TN-2020-000111
        category:
          type: string
          example: B
        issueDate:
          type: string
          format: date
          example: 2020-03-15
        expiryDate:
          type: string
          format: date
          example: 2030-03-15
        verified:
          type: boolean
          description: Vérifié par un AGENT ou un ADMIN
          example: true
        expired:
          type: boolean
          description: "Calculé : date d'expiration dépassée"
          example: false
      description: Permis de conduire
    UserResponse:
