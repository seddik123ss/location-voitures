  responses:
    BadRequest:
      description: "Requête invalide (JSON illisible, champ ou paramètre obligatoire\
        \ manquant)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 400
            error: BAD_REQUEST
            message: Champs obligatoires manquants
            details:
            - message: ne doit pas être vide
              field: code
    Unauthorized:
      description: Token absent ou invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 401
            error: UNAUTHORIZED
            message: "Authentification requise : token Bearer absent ou invalide"
            details: []
    Forbidden:
      description: "Rôle insuffisant, niveau insuffisant ou bon d'un autre client"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 403
            error: FORBIDDEN
            message: Ce code est réservé au niveau GOLD
            details:
            - message: Ce code est réservé au niveau GOLD
              field: code
    NotFound:
      description: Objet introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 404
            error: NOT_FOUND
            message: "Code promo introuvable : INCONNU"
            details:
            - message: "Code promo introuvable : INCONNU"
              field: code
    Conflict:
      description: "Conflit métier (code épuisé, déjà utilisé, doublon)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 409
            error: CONFLICT
            message: Ce code promo a atteint son nombre maximal d'utilisations
            details:
            - message: Ce code promo a atteint son nombre maximal d'utilisations
              field: code
    Unprocessable:
      description: Règle métier ou format non respecté
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 422
            error: UNPROCESSABLE_ENTITY
            message: Ce code promo a expiré le 2026-09-30
            details:
            - message: Ce code promo a expiré le 2026-09-30
              field: code
    BadGateway:
      description: Réponse illisible de user-service ou reservation-service
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 502
            error: BAD_GATEWAY
            message: Réponse illisible de user-service
            details: []
    ServiceUnavailable:
      description: user-service ou reservation-service arrêté ou absent d'Eureka
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            status: 503
            error: SERVICE_UNAVAILABLE
            message: user-service est indisponible (arrêté ou absent d'Eureka)
            details: []
  securitySchemes:
    bearerAuth:
      type: http
      description: Token Keycloak (realm location-voitures). Voir le README pour l'obtenir.
      scheme: bearer
      bearerFormat: JWT
